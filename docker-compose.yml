services:
  certforge:
    # Released image; `docker compose pull && docker compose up -d` updates it. `docker compose build` builds from this folder instead.
    image: ghcr.io/jballanger0226/certforge:latest
    build: .
    container_name: certforge
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"          # serves the CA files and revocation list to clients; redirects everything else to 443
    environment:
      # Names and addresses people will use to reach this server (comma separated). Inside a container
      # CertForge can't see your network's names, so set this one.
      CERTFORGE_HOSTNAMES: "certforge.lan,localhost"
      # Zero-touch setup (optional): with both set, the CA is created on first start and there is no wizard.
      # Prefer secrets over plain values (see below).
      # CERTFORGE_ADMIN_PASSWORD_FILE: /run/secrets/certforge_admin
      # CERTFORGE_CA_PASSPHRASE_FILE: /run/secrets/certforge_ca
      # CERTFORGE_ORG: "Home Lab"
      # Turn the ACME server on at setup, for these domains (certbot, Caddy, Proxmox... can then renew by themselves):
      # CERTFORGE_ACME_DOMAINS: "lab.example.com"
      # CERTFORGE_ACME_NETWORKS: "192.168.1.0/24"
      # A separate signing CA for ACME, so your main CA's key can stay locked (README: "A separate CA for ACME").
      # 'intermediate' = signed by your existing root; 'root' = its own root (then also CERTFORGE_ACME_ROOT_PASSPHRASE_FILE).
      # The passphrase below also unlocks the key at every start, so it must stay available as a secret.
      # CERTFORGE_ACME_CA: "intermediate"
      # CERTFORGE_ACME_CA_PASSPHRASE_FILE: /run/secrets/certforge_acme_ca
      # Optional: choose your own first-run setup token instead of reading it from `docker logs certforge`.
      # CERTFORGE_SETUP_TOKEN: "change-me"
    volumes:
      - certforge-data:/data
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0    # lets the non-root user bind 443 and 80
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

# secrets:                               # for zero-touch setup
#   certforge_admin: {file: ./secrets/admin_password.txt}
#   certforge_ca: {file: ./secrets/ca_passphrase.txt}
#   certforge_acme_ca: {file: ./secrets/acme_ca_passphrase.txt}      # only with CERTFORGE_ACME_CA
# ...and under the service:  secrets: [certforge_admin, certforge_ca, certforge_acme_ca]

volumes:
  certforge-data:
