{% extends "base.html" %}
{% block title %}Sign in – {{ org }}{% endblock %}
{% block content %}
<div class="center-page">
  <h1>Sign in</h1>
  {% if error %}<p class="note error mt" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Admin password</label>
    <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
    <div class="actions"><button class="btn big" type="submit">Sign in</button></div>
  </form>
  <p class="mt small">Setting up a device instead? Open the <a href="/trust">trust page</a>, no password needed.</p>
</div>
{% endblock %}
