name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python errors (syntax, undefined names)
        run: pipx run ruff check --select E9,F63,F7,F82,F811,F821 .
      - name: Shell scripts
        run: shellcheck --severity=warning deploy/*.sh deploy/ct/*.sh deploy/ct/certforge-code
      - name: Compose file
        run: docker compose -f docker-compose.yml config -q
      - name: Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Engine, name-detection and service tests (CA checked against the OpenSSL command line)
        run: python -m unittest tests.test_ca tests.test_netinfo tests.test_service -v
      - name: End-to-end tests (real server on ports 443 and 80)
        # Ports below 1024 need root; run the same interpreter with the same packages.
        run: sudo -E "$(which python)" -m unittest tests.test_e2e -v

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx run pip-audit -r requirements.txt

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t certforge:ci .
      - name: Run with the same restrictions as docker-compose.yml
        run: |
          docker run -d --name certforge --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            -e CERTFORGE_HOSTNAMES=localhost -p 443:443 -p 80:80 certforge:ci
      - name: Wait until healthy and check behaviour
        run: |
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' certforge)" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' certforge)" = true ] || { docker logs certforge; exit 1; }
            sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' certforge)" = healthy ] || { docker logs certforge; exit 1; }
          test "$(docker exec certforge id -u)" != 0                       # not running as root
          # -k only because no CA exists yet on a fresh container; the e2e tests verify certificates properly.
          test "$(curl -ks https://localhost/healthz)" = ok
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost/ | grep -q '^307 https://'
          docker logs certforge 2>&1 | grep -q "setup code"                # first-run code is printed
      - name: Logs on failure
        if: failure()
        run: docker logs certforge
