name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python errors (syntax, undefined names)
        run: pipx run ruff check --select E9,F63,F7,F82,F811,F821 .
      - name: Shell scripts
        run: shellcheck --severity=warning deploy/*.sh deploy/ct/*.sh deploy/ct/certforge-code
      - name: Compose file
        run: docker compose -f docker-compose.yml config -q
      - name: Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Engine, name-detection and service tests (CA checked against the OpenSSL command line)
        run: python -m unittest tests.test_ca tests.test_netinfo tests.test_service tests.test_acme tests.test_acmeca tests.test_version tests.test_update_tool tests.test_seal -v
      - name: End-to-end tests (real server on ports 443 and 80)
        # Ports below 1024 need root; run the same interpreter with the same packages.
        run: sudo -E "$(which python)" -m unittest tests.test_e2e -v 2>&1 | tee /tmp/e2e.log
      - name: End-to-end failures (shown as an annotation, since job logs may be unavailable)
        if: failure()
        run: |
          grep -E -A12 "^(FAIL|ERROR):" /tmp/e2e.log | cut -c1-300 | tail -c 9000 | gzip -9 | base64 -w0 | fold -w 3500 \
            | awk '{ printf "::error title=e2e part %d::%s\n", NR, $0 }'

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx run pip-audit -r requirements.txt

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg VERSION=0.0.0-ci --build-arg REVISION=${GITHUB_SHA} -t certforge:ci .
      - name: Run with the same restrictions as docker-compose.yml
        run: |
          docker run -d --name certforge --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            -e CERTFORGE_HOSTNAMES=localhost -p 443:443 -p 80:80 certforge:ci
      - name: Wait until healthy and check behaviour
        run: |
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' certforge)" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' certforge)" = true ] || { docker logs certforge; exit 1; }
            sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' certforge)" = healthy ] || { docker logs certforge; exit 1; }
          test "$(docker exec certforge id -u)" != 0                       # not running as root
          docker exec certforge python -m app.server --version | grep -q "^CertForge 0.0.0-ci (${GITHUB_SHA::7}"   # build identity is baked in
          # -k only because no CA exists yet on a fresh container; the e2e tests verify certificates properly.
          test "$(curl -ks https://localhost/healthz)" = ok
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost/ | grep -q '^307 https://'
          docker logs certforge 2>&1 | grep -q "setup code"                # first-run code is printed
      - name: Logs on failure
        if: failure()
        run: docker logs certforge

  acme-clients:
    # main = ACME signed by the main intermediate (the default); intermediate = a dedicated ACME issuing CA under
    # the same root; root = a dedicated ACME CA with a root of its own
    name: ACME with certbot and lego (${{ matrix.ca }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ca: [main, intermediate, root]
    env:
      ADMIN_PW: ci-admin-password-123
      CA_PASS: ci-ca-passphrase-456
      ACME_CA: ${{ matrix.ca }}
      ACME_CA_PASS: ci-acme-issuing-passphrase-789
      ACME_ROOT_PASS: ci-acme-root-passphrase-012
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg VERSION=0.0.0-ci --build-arg REVISION=${GITHUB_SHA} -t certforge:ci .
      - name: Names (certforge.test is this machine; app.certforge.test is the machine asking for a certificate)
        run: |
          mkdir -p /tmp/diag
          IP=$(ip -4 route get 1.1.1.1 | grep -oP 'src \K\S+')
          echo "IP=$IP" >> "$GITHUB_ENV"
          echo "127.0.0.1 certforge.test" | sudo tee -a /etc/hosts
          echo "$IP app.certforge.test" | sudo tee -a /etc/hosts
      - name: Start CertForge, set up from its environment (zero-touch) with ACME on
        run: |
          EXTRA=()
          if [ "$ACME_CA" != main ]; then
            EXTRA+=(-e CERTFORGE_ACME_CA="$ACME_CA" -e CERTFORGE_ACME_CA_PASSPHRASE="$ACME_CA_PASS" -e CERTFORGE_ACME_CA_PERMITTED=certforge.test)
          fi
          [ "$ACME_CA" = root ] && EXTRA+=(-e CERTFORGE_ACME_ROOT_PASSPHRASE="$ACME_ROOT_PASS")
          docker run -d --name cf --add-host "app.certforge.test:$IP" -p 443:443 -p 8080:80 \
            -e CERTFORGE_HOSTNAMES=certforge.test -e CERTFORGE_ORG="CI Lab" \
            -e CERTFORGE_ADMIN_PASSWORD="$ADMIN_PW" -e CERTFORGE_CA_PASSPHRASE="$CA_PASS" \
            -e CERTFORGE_ACME_DOMAINS=certforge.test "${EXTRA[@]}" certforge:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8080/pki/root.crt -o root.crt && break; sleep 2; done
          test -s root.crt
          # The API is served with the main CA's certificate, so clients always trust root.crt for that. The certificates
          # they are given chain to the ACME root, which is a different file when ACME has a root of its own.
          if [ "$ACME_CA" = root ]; then
            curl -fsS http://127.0.0.1:8080/pki/acme-root.crt -o issuing-root.crt
            echo "CRL=acme-intermediate.crl" >> "$GITHUB_ENV"
          else
            cp root.crt issuing-root.crt
            if [ "$ACME_CA" = main ]; then echo "CRL=intermediate.crl" >> "$GITHUB_ENV"; else echo "CRL=acme-intermediate.crl" >> "$GITHUB_ENV"; fi
          fi
          ! cmp -s root.crt issuing-root.crt || [ "$ACME_CA" != root ]
          curl -fsS --cacert root.crt https://certforge.test/healthz
          curl -fsS --cacert root.crt https://certforge.test/acme/directory | tee /tmp/diag/directory.json
      - name: certbot gets a certificate (HTTP-01 on port 80)
        run: |
          sudo apt-get install -y -qq certbot >/dev/null
          sudo env REQUESTS_CA_BUNDLE="$PWD/root.crt" certbot certonly --standalone --non-interactive --agree-tos \
            --register-unsafely-without-email --no-eff-email --server https://certforge.test/acme/directory \
            -d app.certforge.test 2>&1 | tee /tmp/diag/certbot.txt
          L=/etc/letsencrypt/live/app.certforge.test
          sudo openssl verify -CAfile issuing-root.crt -untrusted $L/chain.pem -purpose sslserver -verify_hostname app.certforge.test $L/cert.pem
          sudo openssl x509 -in $L/cert.pem -noout -serial | tee first-serial
          # who signed it: the dedicated ACME CA, or (main) the ordinary intermediate
          ISSUER=$(sudo openssl x509 -in $L/cert.pem -noout -issuer | tee /tmp/diag/issuer.txt)
          if [ "$ACME_CA" = main ]; then ! grep -q "ACME Issuing CA" <<<"$ISSUER"; else grep -q "ACME Issuing CA" <<<"$ISSUER"; fi
          if [ "$ACME_CA" = root ]; then ! sudo openssl verify -CAfile root.crt -untrusted $L/chain.pem $L/cert.pem >/dev/null 2>&1; fi
      - name: certbot renews (new certificate, still valid)
        run: |
          sudo env REQUESTS_CA_BUNDLE="$PWD/root.crt" certbot renew --force-renewal --cert-name app.certforge.test 2>&1 | tee /tmp/diag/certbot-renew.txt
          L=/etc/letsencrypt/live/app.certforge.test
          sudo openssl verify -CAfile issuing-root.crt -untrusted $L/chain.pem -purpose sslserver -verify_hostname app.certforge.test $L/cert.pem
          sudo openssl x509 -in $L/cert.pem -noout -serial > second-serial
          ! diff -q first-serial second-serial
      - name: certbot revokes it, and the CRL lists it
        run: |
          sudo env REQUESTS_CA_BUNDLE="$PWD/root.crt" certbot revoke --non-interactive --cert-name app.certforge.test \
            --server https://certforge.test/acme/directory --reason keycompromise 2>&1 | tee /tmp/diag/certbot-revoke.txt
          curl -fsS "http://127.0.0.1:8080/pki/$CRL" | openssl crl -inform DER -noout -text | tee /tmp/diag/crl.txt
          grep -q "Serial Number" /tmp/diag/crl.txt
      - name: lego gets a certificate
        run: |
          docker run --rm --network host --add-host certforge.test:127.0.0.1 --add-host app.certforge.test:127.0.0.1 \
            -e LEGO_CA_CERTIFICATES=/data/root.crt -v "$PWD":/data goacme/lego:v4.21.0 \
            --server https://certforge.test/acme/directory --accept-tos --email ci@certforge.test \
            --http --http.port :80 --path /data/lego -d app.certforge.test run 2>&1 | tee /tmp/diag/lego.txt
          sudo chown -R "$USER" lego
          openssl verify -CAfile issuing-root.crt -untrusted lego/certificates/app.certforge.test.crt -purpose sslserver \
            -verify_hostname app.certforge.test lego/certificates/app.certforge.test.crt
      - name: Diagnostics (shown as an annotation, since job logs may be unavailable)
        if: failure()
        run: |
          docker logs cf > /tmp/diag/certforge.log 2>&1 || true
          sudo tail -n 80 /var/log/letsencrypt/letsencrypt.log > /tmp/diag/letsencrypt.log 2>/dev/null || true
          # annotations are capped near 4 KB, so send each file's tail separately, compressed and chunked
          cd /tmp/diag
          for f in *; do
            [ -f "$f" ] || continue
            tail -c 5000 "$f" | gzip -9 | base64 -w0 | fold -w 3500 | awk -v f="$f" '{ printf "::error title=diag %s part %d::%s\n", f, NR, $0 }'
          done
